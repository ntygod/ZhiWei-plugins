name: Validate Plugins

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Export channel index
        shell: pwsh
        run: |
          ./tools/export-channel-index.ps1 -OutputPath ./artifacts/index.json

      - name: Test mock connector
        run: mvn -q test
        working-directory: connectors/mock-http-connector
